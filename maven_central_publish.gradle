// 依赖信息
def groupIdDefined = "com.licheedev"
def artifactIdDefined = "logplus"
// 如果是测试版，版本号后面加上 -SNAPSHOT
def versionDefined = "1.0.3"
// 其他信息
def developerPage = "https://github.com/licheedev"
def gitRepo = "github.com/licheedev/LogPlus"
def libName = "LogPlus"
def libDesc = "Android Logcat util"

// 配置是否上传
def toUpload = true

//在库build.gradle中加入，最新版本号参考 https://vanniktech.github.io/gradle-maven-publish-plugin/central/
//plugins {
//    ...
//    id "com.vanniktech.maven.publish" version "0.34.0"
//}

// 在gradle.properties加入
//mavenCentralPublishing=true
//signAllPublications=true

//在module的build.gradle末位加入
//apply from: '../maven_central_publish.gradle'

// 运行"publishToMavenCentral"任务上传
// 上传结果在https://central.sonatype.com/publishing/deployments


if (toUpload) {
    println "user=${mavenCentralUsername},key=${mavenCentralPassword}"
    
    mavenPublishing {
        coordinates("$groupIdDefined", "$artifactIdDefined", "$versionDefined")

        pom {
            name = "$libName"
            description = "$libDesc"
            url = "$gitRepo"

            licenses {
                license {
                    name = "The MIT License"
                    url = "https://opensource.org/licenses/MIT"
                    distribution = "https://opensource.org/licenses/MIT"
                }
            }

            //licenses {
            //    license {
            //        name = "The Apache License, Version 2.0"
            //        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            //        distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            //    }
            //}

            developers {
                developer {
                    id = "licheedev"
                    name = "John Lee"
                    email = "licheedev@foxmail.com"
                    url = "$developerPage"
                }
            }
            scm {
                url = "https://${gitRepo}/"
                connection = "scm:git:git://${gitRepo}.git"
                developerConnection = "scm:git:ssh://git@${gitRepo}.git"
            }
        }
    }
}